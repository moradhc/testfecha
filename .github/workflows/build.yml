      - name: Compilar el paquete
        run: |
          make clean || true
          make package FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0

      - name: Verificar que lleva todo
        run: |
          echo "Paquete generado:"
          ls -la packages/*.deb
          grep -q "FontSize" dsbprefs/Resources/Root.plist && echo "OK: rueda de tamano incluida" || (echo "FALTA la rueda" && exit 1)

      - name: Subir el .deb
        uses: actions/upload-artifact@v4
        with:
          name: DateSpeedBar-deb
          path: packages/*.deb
          if-no-files-found: error
